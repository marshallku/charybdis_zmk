## Disable RGB on left to rule out WS2812 interrupt-disable regions
## starving the BLE peripheral stack and causing hangs.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n
CONFIG_LED_STRIP=n

## Deep sleep — automatic recovery path when the central disappears.
##
## ZMK v0.3's split peripheral gets exactly one shot at restarting advertising:
## peripheral.c `disconnected()` does a single k_work_submit(&advertising_work),
## and advertising_cb() only LOG_ERRs on failure — no retry. The transport layer
## does not rescue it either; select_first_available_transport() returns early on
## "already selected" and never re-calls set_enabled(true). So a half that loses
## the dongle mid-flight can sit there advertising to nobody until it is
## physically reset.
##
## Deep sleep breaks that loop: activity.c calls sys_poweroff() -> nRF52 System
## OFF, and waking from System OFF is a full reset, so the BLE stack re-inits and
## advertising restarts clean. Costs a ~1-3s wake plus the keypress that woke it.
## Trackball motion will NOT wake it (no GPIO sense wired to the PMW3610).
##
## Battery only — activity.c gates deep sleep on `!is_usb_power_present()`.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
