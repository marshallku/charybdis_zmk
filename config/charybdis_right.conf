## Deep sleep — automatic recovery path when the central disappears.
## See charybdis_left.conf for the full rationale (ZMK v0.3 split peripheral has
## no advertising retry; waking from nRF52 System OFF is a reset, which re-inits
## BLE and restarts advertising).
##
## In dongle format this half is a peripheral and this applies. In bt format it
## is the central and usually on USB, where activity.c's `!is_usb_power_present()`
## gate keeps it awake anyway.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
